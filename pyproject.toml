[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorforge"
version = "0.1.0"
description = "A tiny optimizing tensor compiler with a C JIT backend"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["tensorforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
